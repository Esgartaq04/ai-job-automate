name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # pgvector is required for the schema and the recall query, so the
    # integration test runs against the same image docker-compose uses rather
    # than being skipped in CI.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: autoapply
          POSTGRES_PASSWORD: autoapply
          POSTGRES_DB: autoapply_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autoapply"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      AUTOAPPLY_TEST_DATABASE_URL: postgresql+psycopg://autoapply:autoapply@localhost:5432/autoapply_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # No browser download: nothing in the suite launches Chromium.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pip install -e ".[dev]"

      # `python -m` so the checks run under the interpreter pip installed into,
      # not whatever else happens to be first on PATH.
      - name: Lint
        run: python -m ruff check src tests

      - name: Test
        # No ANTHROPIC_API_KEY: every model call in the suite is stubbed. If a
        # test ever needs a real key, that test is wrong.
        run: python -m pytest -q
