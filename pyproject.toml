[project]
name = "autoapply"
version = "0.1.0"
description = "AI agent that discovers jobs, tailors applications from a verified fact store, submits them, and reports back."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "anthropic>=0.40",
    "playwright>=1.45",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "typer>=0.12",
]

[project.optional-dependencies]
gcs = ["google-cloud-storage>=2.17"]
gmail = [
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
autoapply = "autoapply.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoapply = ["api/static/*", "pipeline/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
